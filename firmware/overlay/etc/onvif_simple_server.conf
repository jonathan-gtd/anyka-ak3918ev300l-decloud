model=AK3918EV300L-PTZ
manufacturer=Anyka
firmware_ver=decloud
hardware_id=AK3918EV300L
serial_num=SERIAL
ifs=wlan0
port=80
scope=onvif://www.onvif.org/Profile/Streaming
scope=onvif://www.onvif.org/Profile/T
scope=onvif://www.onvif.org/hardware/AK3918EV300L
scope=onvif://www.onvif.org/name/HOSTNAME
#user=admin
#password=admin
adv_enable_media2=1
adv_enable_imaging=0
adv_fault_if_unknown=0
adv_fault_if_set=0
adv_synology_nvr=0

#Profile 0
name=Profile_0
width=1920
height=1080
url=rtsp://%s:554/vs0
snapurl=http://%s/snapshot.jpg
type=H265
bitrate=1536
framerate=15
audio_encoder=NONE
audio_decoder=NONE

#Profile 1
name=Profile_1
width=640
height=360
url=rtsp://%s:554/vs1
snapurl=http://%s/snapshot.jpg
type=H265
bitrate=300
framerate=15
audio_encoder=NONE
audio_decoder=NONE

#PTZ (pan only: the tilt motor is not driven)
ptz=1
min_step_x=0
max_step_x=4340
min_step_y=0
max_step_y=0
min_step_z=0
max_step_z=0
get_position=/app/bin/ptz pos
is_moving=/app/bin/ptz moving
move_left=/app/bin/ptz left %f
move_right=/app/bin/ptz right %f
move_stop=/app/bin/ptz stop %s
move_preset=/app/bin/ptz preset goto %d
goto_home_position=/app/bin/ptz center
set_preset=/app/bin/ptz preset set %d %s
set_home_position=/app/bin/ptz center
remove_preset=/app/bin/ptz preset del %d
jump_to_abs=/app/bin/ptz goto %f
jump_to_rel=/app/bin/ptz rel %f
get_presets=/app/bin/ptz preset list

#EVENT
events=0
